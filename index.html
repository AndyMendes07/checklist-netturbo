<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist R&S - Net Turbo</title>
    <style>
        :root {
            --primary-color: #0056b3; /* Azul corporativo */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
        }

        /* Estilo para os inputs de cabeçalho */
        .header-inputs {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .input-group label {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        .input-group input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
        }

        .section-title {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border-radius: var(--border-radius);
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-item:hover {
            background-color: #f9f9f9;
        }

        /* Checkbox Customizado */
        .checklist-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary-color);
            border-radius: 4px;
            margin-right: 15px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0; /* Impede que o checkbox encolha */
        }

        .checklist-item input[type="checkbox"]:checked {
            background-color: var(--primary-color);
        }

        .checklist-item input[type="checkbox"]:checked::after {
            content: '✔';
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }

        .checklist-item label {
            cursor: pointer;
            flex-grow: 1;
            font-size: 16px;
        }

        /* Estilo para itens riscados quando marcados */
        .checklist-item input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #888;
        }

        /* Classe para ocultar itens */
        .hidden {
            display: none !important;
        }

        /* Destaque para sub-opções */
        .sub-option {
            background-color: #eef6ff;
            border-left: 4px solid var(--primary-color);
            margin-left: 20px;
            border-radius: 4px;
        }

        /* Botão de Reset */
        .actions {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #c82333;
        }
        
        button.print-btn {
            background-color: var(--primary-color);
            margin-right: 10px;
        }

        button.print-btn:hover {
            background-color: #004494;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Checklist de Processo Seletivo</h1>
            <div class="header-inputs">
                <div class="input-group">
                    <label for="vagaNome">Nome da Vaga:</label>
                    <input type="text" id="vagaNome" placeholder="Ex: Analista Comercial">
                </div>
                <div class="input-group">
                    <label for="dataProcesso">Data:</label>
                    <input type="date" id="dataProcesso">
                </div>
            </div>
        </header>

        <form id="checklistForm">
            <div class="section-title">1. Abertura de Vaga</div>
            <div class="checklist-item">
                <input type="checkbox" id="item1-1">
                <label for="item1-1">Receber solicitação de vaga aprovada</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item1-2">
                <label for="item1-2">Realizar reunião de alinhamento com gestor (Briefing)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item1-3">
                <label for="item1-3">Definir Perfil Comportamental (DISC/Outros)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item1-4">
                <label for="item1-4">Criar job description e validar com gestor</label>
            </div>

            <div class="section-title">2. Divulgação e Sourcing</div>
            <div class="checklist-item">
                <input type="checkbox" id="item2-1">
                <label for="item2-1">Divulgar vaga (LinkedIn, Sites de Vagas, Interno)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item2-2">
                <label for="item2-2">Realizar Hunting ativo (se necessário)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item2-3">
                <label for="item2-3">Triagem de currículos recebidos</label>
            </div>

            <div class="section-title">3. Entrevistas e Avaliações</div>
            <div class="checklist-item">
                <input type="checkbox" id="item3-1">
                <label for="item3-1">Entrevista de Fit Cultural (RH)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item3-2">
                <label for="item3-2">Aplicar testes técnicos/comportamentais</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item3-3">
                <label for="item3-3">Enviar shortlist para o gestor</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item3-4">
                <label for="item3-4">Agendar entrevista técnica com gestor</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item3-5">
                <label for="item3-5">Coletar feedback do gestor sobre finalistas</label>
            </div>

            <div class="section-title">4. Proposta</div>
            <div class="checklist-item">
                <input type="checkbox" id="item4-1">
                <label for="item4-1">Validar condições de contratação (Salário/Benefícios)</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item4-2">
                <label for="item4-2">Enviar proposta verbal ao candidato</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item4-3">
                <label for="item4-3">Formalizar proposta por e-mail</label>
            </div>

            <div class="section-title">5. Admissão e Onboarding</div>
            
            <div class="checklist-item">
                <input type="checkbox" id="item5-1">
                <label for="item5-1">Receber aceite do candidato</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item5-2">
                <label for="item5-2">Solicitar documentação admissional</label>
            </div>

            <div class="checklist-item sub-option">
                <input type="checkbox" id="check-pj" onchange="toggleContractFields()">
                <label for="check-pj"><strong>O contrato será PJ?</strong></label>
            </div>
            <div class="checklist-item sub-option">
                <input type="checkbox" id="check-clt" onchange="toggleContractFields()">
                <label for="check-clt"><strong>O contrato será CLT?</strong></label>
            </div>

            <div class="checklist-item hidden" id="row-pj-1">
                <input type="checkbox" id="item-pj-1">
                <label for="item-pj-1">PJ: Enviar MEI p/ Fiscal</label>
            </div>
            <div class="checklist-item hidden" id="row-pj-2">
                <input type="checkbox" id="item-pj-2">
                <label for="item-pj-2">Enviar dados para elaboração de contrato p/ DP</label>
            </div>

            <div class="checklist-item hidden" id="row-clt-1">
                <input type="checkbox" id="item-clt-1">
                <label for="item-clt-1">CLT: Agendar exame admissional (SOC)</label>
            </div>

            <div class="checklist-item">
                <input type="checkbox" id="item5-5">
                <label for="item5-5">Enviar documentos para o DP</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item5-6">
                <label for="item5-6">Agendar integração/Onboarding</label>
            </div>
            <div class="checklist-item">
                <input type="checkbox" id="item5-7">
                <label for="item5-7">Solicitar equipamentos e acessos (TI)</label>
            </div>

            <div class="actions">
                <button type="button" class="print-btn" onclick="window.print()">Imprimir / Salvar PDF</button>
                <button type="button" onclick="resetForm()">Limpar Checklist</button>
            </div>
        </form>
    </div>

    <script>
        // Função para alternar a visibilidade dos campos PJ/CLT
        function toggleContractFields() {
            const checkPJ = document.getElementById('check-pj');
            const checkCLT = document.getElementById('check-clt');
            
            const rowPJ1 = document.getElementById('row-pj-1');
            const rowPJ2 = document.getElementById('row-pj-2');
            const rowCLT1 = document.getElementById('row-clt-1');

            // Lógica PJ
            if (checkPJ.checked) {
                rowPJ1.classList.remove('hidden');
                rowPJ2.classList.remove('hidden');
            } else {
                rowPJ1.classList.add('hidden');
                rowPJ2.classList.add('hidden');
                // Desmarcar os itens se ocultar, opcional
                document.getElementById('item-pj-1').checked = false;
                document.getElementById('item-pj-2').checked = false;
            }

            // Lógica CLT
            if (checkCLT.checked) {
                rowCLT1.classList.remove('hidden');
            } else {
                rowCLT1.classList.add('hidden');
                // Desmarcar item se ocultar
                document.getElementById('item-clt-1').checked = false;
            }
        }

        // Recuperar estado dos checkboxes ao carregar
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(box => {
                const saved = localStorage.getItem(box.id);
                if (saved === 'true') {
                    box.checked = true;
                }
            });

            // Recuperar textos do cabeçalho
            const vagaInput = document.getElementById('vagaNome');
            const dataInput = document.getElementById('dataProcesso');
            
            if(localStorage.getItem('vagaNome')) vagaInput.value = localStorage.getItem('vagaNome');
            if(localStorage.getItem('dataProcesso')) dataInput.value = localStorage.getItem('dataProcesso');

            // Forçar a verificação de visibilidade ao carregar a página
            toggleContractFields();
        });

        // Salvar estado ao clicar
        const allInputs = document.querySelectorAll('input');
        allInputs.forEach(input => {
            input.addEventListener('change', () => {
                // Salvar checkboxes
                if(input.type === 'checkbox') {
                    localStorage.setItem(input.id, input.checked);
                } 
                // Salvar textos
                else {
                    localStorage.setItem(input.id, input.value);
                }
            });
        });

        function resetForm() {
            if(confirm('Tem certeza que deseja limpar todo o checklist?')) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
