<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist R&S - Net Turbo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .header-fields {
            margin-bottom: 20px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            display: flex;
            gap: 20px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .field-group label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .field-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        h2 {
            color: #0056b3;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 5px;
            margin-top: 30px;
        }
        .item {
            margin: 10px 0;
            display: flex;
            align-items: center;
        }
        .item input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
            cursor: pointer;
        }
        .item label {
            cursor: pointer;
            font-size: 16px;
        }
        /* Estilo para item riscado quando marcado */
        .item input:checked + label {
            text-decoration: line-through;
            color: #888;
        }
        
        /* Classes novas APENAS para a lógica do item 5 */
        .hidden {
            display: none !important;
        }
        .indent-option {
            margin-left: 25px;
            padding: 5px;
            background-color: #f9f9f9;
            border-left: 3px solid #0056b3;
        }
        
        .btn-container {
            text-align: center;
            margin-top: 40px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 5px;
        }
        button:hover {
            background-color: #004494;
        }
        button.clear-btn {
            background-color: #dc3545;
        }
        button.clear-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Checklist de Processo Seletivo</h1>
    
    <div class="header-fields">
        <div class="field-group">
            <label>Nome da Vaga:</label>
            <input type="text" id="vaga-nome" placeholder="Ex: Analista Comercial">
        </div>
        <div class="field-group">
            <label>Data:</label>
            <input type="date" id="data-processo">
        </div>
    </div>

    <h2>1. Abertura de Vaga</h2>
    <div class="item"><input type="checkbox" id="check1"><label for="check1">Receber solicitação de vaga aprovada</label></div>
    <div class="item"><input type="checkbox" id="check2"><label for="check2">Realizar reunião de alinhamento com gestor (Briefing)</label></div>
    <div class="item"><input type="checkbox" id="check3"><label for="check3">Definir Perfil Comportamental (DISC/Outros)</label></div>
    <div class="item"><input type="checkbox" id="check4"><label for="check4">Criar job description e validar com gestor</label></div>

    <h2>2. Divulgação e Sourcing</h2>
    <div class="item"><input type="checkbox" id="check5"><label for="check5">Divulgar vaga (LinkedIn, Sites de Vagas, Interno)</label></div>
    <div class="item"><input type="checkbox" id="check6"><label for="check6">Realizar Hunting ativo (se necessário)</label></div>
    <div class="item"><input type="checkbox" id="check7"><label for="check7">Triagem de currículos recebidos</label></div>

    <h2>3. Entrevistas e Avaliações</h2>
    <div class="item"><input type="checkbox" id="check8"><label for="check8">Entrevista de Fit Cultural (RH)</label></div>
    <div class="item"><input type="checkbox" id="check9"><label for="check9">Aplicar testes técnicos/comportamentais</label></div>
    <div class="item"><input type="checkbox" id="check10"><label for="check10">Enviar shortlist para o gestor</label></div>
    <div class="item"><input type="checkbox" id="check11"><label for="check11">Agendar entrevista técnica com gestor</label></div>
    <div class="item"><input type="checkbox" id="check12"><label for="check12">Coletar feedback do gestor sobre finalistas</label></div>

    <h2>4. Proposta</h2>
    <div class="item"><input type="checkbox" id="check13"><label for="check13">Validar condições de contratação (Salário/Benefícios)</label></div>
    <div class="item"><input type="checkbox" id="check14"><label for="check14">Enviar proposta verbal ao candidato</label></div>
    <div class="item"><input type="checkbox" id="check15"><label for="check15">Formalizar proposta por e-mail</label></div>

    <h2>5. Admissão e Onboarding</h2>
    
    <div class="item"><input type="checkbox" id="check16"><label for="check16">Receber aceite do candidato</label></div>
    <div class="item"><input type="checkbox" id="check17"><label for="check17">Solicitar documentação admissional</label></div>

    <div class="item indent-option">
        <input type="checkbox" id="opt-pj" onchange="toggleContract()">
        <label for="opt-pj"><strong>O contrato será PJ?</strong></label>
    </div>
    
    <div class="item hidden" id="pj-group-1"><input type="checkbox" id="check-pj1"><label for="check-pj1">PJ: Enviar MEI p/ Fiscal</label></div>
    <div class="item hidden" id="pj-group-2"><input type="checkbox" id="check-pj2"><label for="check-pj2">Enviar dados para elaboração de contrato p/ DP</label></div>

    <div class="item indent-option">
        <input type="checkbox" id="opt-clt" onchange="toggleContract()">
        <label for="opt-clt"><strong>O contrato será CLT?</strong></label>
    </div>

    <div class="item hidden" id="clt-group-1"><input type="checkbox" id="check-clt1"><label for="check-clt1">CLT: Agendar exame admissional (SOC)</label></div>

    <div class="item"><input type="checkbox" id="check18"><label for="check18">Enviar documentos para o DP</label></div>
    <div class="item"><input type="checkbox" id="check19"><label for="check19">Agendar integração/Onboarding</label></div>
    <div class="item"><input type="checkbox" id="check20"><label for="check20">Solicitar equipamentos e acessos (TI)</label></div>

    <div class="btn-container">
        <button onclick="window.print()">Salvar PDF / Imprimir</button>
        <button class="clear-btn" onclick="clearAll()">Limpar Tudo</button>
    </div>
</div>

<script>
    // Função específica para a lógica do Item 5
    function toggleContract() {
        const isPJ = document.getElementById('opt-pj').checked;
        const isCLT = document.getElementById('opt-clt').checked;

        const pjRow1 = document.getElementById('pj-group-1');
        const pjRow2 = document.getElementById('pj-group-2');
        const cltRow1 = document.getElementById('clt-group-1');

        // Lógica PJ
        if (isPJ) {
            pjRow1.classList.remove('hidden');
            pjRow2.classList.remove('hidden');
        } else {
            pjRow1.classList.add('hidden');
            pjRow2.classList.add('hidden');
        }

        // Lógica CLT
        if (isCLT) {
            cltRow1.classList.remove('hidden');
        } else {
            cltRow1.classList.add('hidden');
        }
    }

    // Scripts para salvar o estado dos checkboxes (LocalStorage)
    const inputs = document.querySelectorAll('input');
    
    function saveState() {
        inputs.forEach(input => {
            if(input.type === 'checkbox') {
                localStorage.setItem(input.id, input.checked);
            } else {
                localStorage.setItem(input.id, input.value);
            }
        });
    }

    function loadState() {
        inputs.forEach(input => {
            const saved = localStorage.getItem(input.id);
            if (saved !== null) {
                if(input.type === 'checkbox') {
                    input.checked = (saved === 'true');
                } else {
                    input.value = saved;
                }
            }
        });
        // Roda a verificação de visibilidade ao carregar
        toggleContract();
    }

    inputs.forEach(input => {
        input.addEventListener('change', saveState);
    });

    function clearAll() {
        if(confirm('Deseja limpar todos os dados?')) {
            localStorage.clear();
            location.reload();
        }
    }

    // Carrega ao iniciar
    loadState();
</script>

</body>
</html>
